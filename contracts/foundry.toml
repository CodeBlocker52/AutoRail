[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
# Aevum runs the Shanghai EVM. Cancun opcodes (MCOPY, TSTORE/TLOAD, blobs) deploy but REVERT at runtime.
# Never raise this. `make build` also scans the bytecode (tools/check-shanghai.mjs).
solc_version = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "ipfs"
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./out" }, { access = "read", path = "./config" }]
# The official ERC-8004 registries are written for via-IR (upstream hardhat config: viaIR = true).
# Only they compile with it; our own contracts use the standard pipeline.
additional_compiler_profiles = [{ name = "erc8004", via_ir = true, evm_version = "shanghai" }]
compilation_restrictions = [{ paths = "src/erc8004/{Identity,Reputation}RegistryUpgradeable.sol", via_ir = true, evm_version = "shanghai" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 5000

[rpc_endpoints]
aevum = "https://rpc-test.qday.info"
fork = "http://127.0.0.1:8555"

[fmt]
line_length = 110
# Vendored official ERC-8004 sources stay byte-identical to upstream.
ignore = ["src/erc8004/IdentityRegistryUpgradeable.sol", "src/erc8004/ReputationRegistryUpgradeable.sol"]

[lint]
lint_on_build = false
# Vendored official ERC-8004 sources are not ours to restyle.
ignore = ["src/erc8004/IdentityRegistryUpgradeable.sol", "src/erc8004/ReputationRegistryUpgradeable.sol"]
